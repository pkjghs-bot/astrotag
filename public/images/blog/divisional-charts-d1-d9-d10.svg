<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" height="100%">
  <defs>
    
    <filter id="wm-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2a1d15" flood-opacity="0.12"/>
    </filter>

    <linearGradient id="divBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f9f4eb"/>
    </linearGradient>
  </defs>

  <rect width="680" height="330" rx="14" fill="url(#divBg)" stroke="#e0d3c1" stroke-width="1.8"/>

  <!-- Title -->
  <text x="340" y="32" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#8f360a" text-anchor="middle">THE PARASHARI DIVISIONAL HIERARCHY: D1, D9 &amp; D10</text>
  <text x="340" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6b5b4b" text-anchor="middle">From Physical Seed (D1) to Marital Destiny (D9) and Career Fruition (D10)</text>

  <!-- Card 1: D1 Rashi -->
  <g transform="translate(25, 70)">
    <rect x="0" y="0" width="200" height="215" rx="10" fill="#ffffff" stroke="#c2651a" stroke-width="1.8"/>
    <rect x="0" y="0" width="200" height="36" rx="10" fill="#fef3c7"/>
    <text x="100" y="24" font-family="sans-serif" font-size="14" font-weight="800" fill="#b84a14" text-anchor="middle">D1 &bull; Rashi Chart</text>

    <!-- Mini Diamond Kundli Graphic -->
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="80" height="80" fill="#fffaf2" stroke="#c2651a" stroke-width="1"/>
      <polygon points="40,0 80,40 40,80 0,40" fill="#fde68a" stroke="#c2651a" stroke-width="1"/>
      <line x1="0" y1="0" x2="80" y2="80" stroke="#c2651a" stroke-width="0.8"/>
      <line x1="80" y1="0" x2="0" y2="80" stroke="#c2651a" stroke-width="0.8"/>
      <text x="40" y="44" font-family="sans-serif" font-size="8" font-weight="700" fill="#92400e" text-anchor="middle">Lagna</text>
    </g>

    <text x="100" y="146" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e1b18" text-anchor="middle">The Root Tree</text>
    <text x="100" y="164" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; Physical body &amp; health</text>
    <text x="100" y="180" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; General life direction</text>
    <text x="100" y="196" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; Foundation for all Vargas</text>
  </g>

  <!-- Card 2: D9 Navamsa -->
  <g transform="translate(240, 70)">
    <rect x="0" y="0" width="200" height="215" rx="10" fill="#ffffff" stroke="#c2651a" stroke-width="1.8"/>
    <rect x="0" y="0" width="200" height="36" rx="10" fill="#fef3c7"/>
    <text x="100" y="24" font-family="sans-serif" font-size="14" font-weight="800" fill="#b84a14" text-anchor="middle">D9 &bull; Navamsa Chart</text>

    <!-- Mini Diamond Kundli Graphic -->
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="80" height="80" fill="#fffaf2" stroke="#c2651a" stroke-width="1"/>
      <polygon points="40,0 80,40 40,80 0,40" fill="#fbcfe8" stroke="#be185d" stroke-width="1"/>
      <line x1="0" y1="0" x2="80" y2="80" stroke="#c2651a" stroke-width="0.8"/>
      <line x1="80" y1="0" x2="0" y2="80" stroke="#c2651a" stroke-width="0.8"/>
      <text x="40" y="44" font-family="sans-serif" font-size="8" font-weight="700" fill="#9d174d" text-anchor="middle">D9 Lagna</text>
    </g>

    <text x="100" y="146" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e1b18" text-anchor="middle">The Inner Fruit (1/9th)</text>
    <text x="100" y="164" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; Spouse &amp; marital karma</text>
    <text x="100" y="180" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; Inner spiritual strength</text>
    <text x="100" y="196" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; Unfolds after age 30–32</text>
  </g>

  <!-- Card 3: D10 Dashamsha -->
  <g transform="translate(455, 70)">
    <rect x="0" y="0" width="200" height="215" rx="10" fill="#ffffff" stroke="#c2651a" stroke-width="1.8"/>
    <rect x="0" y="0" width="200" height="36" rx="10" fill="#fef3c7"/>
    <text x="100" y="24" font-family="sans-serif" font-size="14" font-weight="800" fill="#b84a14" text-anchor="middle">D10 &bull; Dashamsha</text>

    <!-- Mini Diamond Kundli Graphic -->
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="80" height="80" fill="#fffaf2" stroke="#c2651a" stroke-width="1"/>
      <polygon points="40,0 80,40 40,80 0,40" fill="#fed7aa" stroke="#c2410c" stroke-width="1"/>
      <line x1="0" y1="0" x2="80" y2="80" stroke="#c2651a" stroke-width="0.8"/>
      <line x1="80" y1="0" x2="0" y2="80" stroke="#c2651a" stroke-width="0.8"/>
      <text x="40" y="44" font-family="sans-serif" font-size="8" font-weight="700" fill="#9a3412" text-anchor="middle">D10 Lagna</text>
    </g>

    <text x="100" y="146" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e1b18" text-anchor="middle">The Worldly Crown (1/10th)</text>
    <text x="100" y="164" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; Career status &amp; prestige</text>
    <text x="100" y="180" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; Public leadership impact</text>
    <text x="100" y="196" font-family="sans-serif" font-size="10" fill="#573a21" text-anchor="middle">&bull; Professional reputation</text>
  </g>

  <!-- Watermark -->
  
  <!-- Astrotags Brand Watermark -->
  <g class="astrotags-watermark" transform="translate(560, 298)">
    <rect x="0" y="0" width="108" height="24" rx="12" fill="#ffffff" fill-opacity="0.94" stroke="#d4a359" stroke-width="0.9" filter="url(#wm-shadow)"/>
    <g transform="translate(4, 3)">
      <circle cx="9" cy="9" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <path d="M7.5 4.5 C5.5 5 4 6.8 4 8.5 C4 10.8 5.8 12.5 8 12.5 C9 12.5 10 12.1 10.6 11.5 C7.5 11.7 5.5 9.2 5.5 6.5 C5.5 5.8 5.7 5 6 4.5 Z" fill="#f59e0b"/>
      <circle cx="9.5" cy="8.5" r="2.8" fill="#b84a14"/>
      <polygon points="9.5,6.8 10,8 11.2,8.5 10,9 9.5,10.2 9,9 7.8,8.5 9,8" fill="#ffffff"/>
    </g>
    <text x="28" y="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#b84a14" letter-spacing="0.2">Astrotags</text>
    <text x="28" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="600" fill="#7c5e42">astrotags.in</text>
  </g>

</svg>