<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220">
  <defs>
    
    <filter id="wm-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2a1d15" flood-opacity="0.12"/>
    </filter>

    
              <radialGradient id="marsGrad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#f87171"/>
                <stop offset="60%" stop-color="#dc2626"/>
                <stop offset="100%" stop-color="#7f1d1d"/>
              </radialGradient>
            
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect width="300" height="220" rx="12" fill="url(#cardGrad)" stroke="#e0d3c1" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="300" height="38" rx="12" fill="#b91c1c" fill-opacity="0.1"/>
  <rect x="0" y="26" width="300" height="12" fill="#b91c1c" fill-opacity="0.1"/>
  <line x1="0" y1="38" x2="300" y2="38" stroke="#b91c1c" stroke-width="0.8" opacity="0.3"/>

  <!-- Top Titles -->
  <text x="14" y="24" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="800" fill="#991b1b">Mars (Mangal)</text>
  <text x="210" y="24" font-family="'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="700" fill="#991b1b">मंगल</text>
  <text x="282" y="24" font-family="sans-serif" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="end">♂</text>

  <!-- Central Planet Graphic -->
  
              <!-- Fiery Crimson Disc -->
              <circle cx="150" cy="100" r="38" fill="url(#marsGrad)" stroke="#991b1b" stroke-width="2"/>
              <circle cx="150" cy="100" r="28" fill="none" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="6,3"/>
              <polygon points="150,78 156,92 150,96 144,92" fill="#fef2f2"/>
              <line x1="150" y1="74" x2="150" y2="124" stroke="#fef2f2" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="150" cy="100" r="8" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/>
            

  <!-- Bottom Info Pills -->
  <g transform="translate(10, 168)">
    <rect x="0" y="0" width="138" height="18" rx="9" fill="#b91c1c" fill-opacity="0.12"/>
    <text x="69" y="12.5" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">Natural Malefic (Warrior Drive)</text>

    <rect x="0" y="22" width="138" height="18" rx="9" fill="#f1f5f9"/>
    <text x="69" y="34.5" font-family="sans-serif" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">Tuesday (Mangalvar) &#8226; Red Coral (Moonga)</text>
  </g>

  <!-- Brand Watermark in bottom right -->
  
  <!-- Astrotags Brand Watermark -->
  <g class="astrotags-watermark" transform="translate(154, 190)">
    <rect x="0" y="0" width="136" height="22" rx="11" fill="#ffffff" fill-opacity="0.95" stroke="#d4a359" stroke-width="0.9" filter="url(#wm-shadow)"/>
    <g transform="translate(4, 3)">
      <circle cx="8" cy="8" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <path d="M6.5 4 C5 4.5 3.5 6 3.5 7.5 C3.5 9.5 5 11 7 11 C8 11 8.8 10.6 9.3 10 C6.8 10.2 5 8 5 5.8 C5 5.1 5.2 4.5 5.5 4 Z" fill="#f59e0b"/>
      <circle cx="8.5" cy="7.5" r="2.5" fill="#b84a14"/>
      <polygon points="8.5,6 8.9,7 10,7.5 8.9,8 8.5,9 8.1,8 7,7.5 8.1,7" fill="#ffffff"/>
    </g>
    <text x="24" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#b84a14">Astrotags <tspan fill="#d4a359">&#8226;</tspan> <tspan font-weight="600" fill="#6b5b4b">astrotags.in</tspan></text>
  </g>

</svg>